[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "so-kernels"
version = "0.1.0.dev0"
description = "Python operator and sampling API backed by Bempp-rs and KiFMM-rs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
backends = [
    "bempp-rs @ git+https://github.com/ignacia-fp/bempp-rs-for-rsrs.git@main",
    "bempp-rs-operators @ git+https://github.com/ignacia-fp/bempp-rs-for-rsrs.git@main#subdirectory=python-operators",
    "bempp-cl @ git+https://github.com/ignacia-fp/bempp-cl-rsrs.git@f16-gmsh-fixes",
    "kifmm_py @ git+https://github.com/ignacia-fp/kifmm-for-rsrs.git@main#subdirectory=kifmm",
]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/so_kernels"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
